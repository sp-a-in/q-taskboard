services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - airtable-adapter
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: dev-secret-change-me
      DEBUG: "true"
      AIRTABLE_ADAPTER_URL: http://airtable-adapter:4000
      AIRTABLE_ADAPTER_SHARED_SECRET: ${AIRTABLE_ADAPTER_SHARED_SECRET:-}

  airtable-adapter:
    build: ./airtable-adapter
    volumes:
      - ./airtable-adapter:/app
      - airtable_adapter_node_modules:/app/node_modules
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      AIRTABLE_API_KEY: ${AIRTABLE_API_KEY:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_TABLE_NAME: ${AIRTABLE_TABLE_NAME:-Tasks}
      ADAPTER_SHARED_SECRET: ${AIRTABLE_ADAPTER_SHARED_SECRET:-}

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
  airtable_adapter_node_modules:
